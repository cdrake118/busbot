[project]
name = "backbinder-pipeline"
version = "0.1.0"
description = "BackBinder delivery pipeline: email intake -> classification -> drafting -> human review queue"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.109",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
